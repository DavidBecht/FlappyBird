name: Check student levels

on:
  push:
  pull_request:

jobs:
  check-levels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run level checks
        run: python tests/test_solutions.py --student-files
